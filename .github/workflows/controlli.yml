name: Controlli

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  controlli:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover tests -v
      - run: python tools/build.py
      - run: python tools/check_seo.py
